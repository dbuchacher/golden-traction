name: Build and check axioms

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Every declaration uses only the standard axioms
        run: lake env lean AxiomCheck.lean
